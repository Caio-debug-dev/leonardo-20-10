<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3e8ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .tela {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .escondido {
            display: none;
        }

        h1 {
            color: #4c1d95;
            font-size: 28px;
            margin-bottom: 20px;
        }

        button {
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #7c3aed;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="tela1" class="tela">
        <h1>Minha Primeira Tela</h1>
        <button onclick="mudarTela()">Clique Aqui</button>
    </div>

    <div id="tela2" class="tela escondido">
        <h1>Está funcionando!</h1>
    </div>

    <script>
        function mudarTela() {
            document.getElementById('tela1').classList.add('escondido');
            document.getElementById('tela2').classList.remove('escondido');
        }
    </script>

</body>
</html>
